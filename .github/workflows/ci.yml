name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  flake8:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install lint dependencies
      run: |
        # --only-group installs ONLY the lint group (no project / prod deps)
        uv sync --only-group lint

    - name: Lint with flake8
      run: |
        # --no-sync keeps the --only-group env (uv run would otherwise pull prod deps)
        uv run --no-sync flake8 seacatauth seacatauth.py

  test:
    needs: flake8
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      run: |
        # --only-group installs ONLY the test group (no python-ldap etc.)
        uv sync --only-group test

    - name: Test with unittest
      run: |
        # --no-sync keeps the --only-group env (uv run would otherwise pull prod deps)
        uv run --no-sync python -m unittest test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}

    steps:
    - uses: actions/checkout@v4

    - name: Docker Metadata action
      uses: docker/metadata-action@v5
      id: meta
      with:
          images:  teskalabs/seacat-auth
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=semver,pattern={{raw}}

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Create Docker Starter
      uses: vimtor/action-zip@v1.2
      with:
        files: example/docker
        dest: seacat-auth-docker-starter.zip

    - name: Upload Docker Starter
      uses: actions/upload-artifact@v4
      with:
        name: seacat-auth-docker-starter
        path: ${{ github.workspace }}/seacat-auth-docker-starter.zip
